name: release

# Publishes core/ to PyPI via trusted publishing (no token in the repo).
# One-time setup on pypi.org: project "scorekeeper" -> Publishing ->
# add GitHub publisher (owner: michalstrnadel, repo: scorekeeper,
# workflow: release.yml, environment: pypi).
# Release: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests before anything ships
        run: |
          uv sync --all-extras
          uv run ruff check src tests
          uv run pytest -q
      - name: Check tag matches package version
        run: |
          pkg_version="$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${pkg_version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${pkg_version}"; exit 1; }
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: core/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
