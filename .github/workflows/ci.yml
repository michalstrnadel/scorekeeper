name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with pyproject classifiers — every advertised version is tested
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --all-extras
      # the three steps below are mirrored by `scripts/e2e.sh core` — keep in sync
      - name: Lint
        run: uv run ruff check src tests ../bench ../scripts
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term --cov-fail-under=85

  # docs, plugin, bench, and smoke each run one scripts/e2e.sh stage — the
  # script is the single source of truth, so local runs and CI cannot drift

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal links in tracked markdown
        run: scripts/e2e.sh docs

  plugin:
    # the hook dispatcher is release-critical and pure bash — the #6 incident
    # (a version-skewed scorer denying every Edit/Write) lived exactly here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Shellcheck, manifests, hook dispatcher smoke tests
        run: scripts/e2e.sh plugin

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Generator + harness tests
        run: scripts/e2e.sh bench

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Demo assertion + clean-room build, twine check, wheel install-smoke
        run: scripts/e2e.sh demo build
